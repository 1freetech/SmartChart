name: Python-only tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Run Python application tests
        run: python -m unittest discover -s desktop -p "test_*.py" -v
      - name: Validate Python-only source and atlas
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile Python modules
        run: python -m compileall -q desktop tests
