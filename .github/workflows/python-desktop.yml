name: Python desktop build
on:
  push:
    branches: [main, feature/python-desktop-app]
    tags: ['desktop-v*']
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Tk libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk libx11-6 xvfb xauth
      - name: Verify embedded catalog is synchronized
        run: python scripts/sync_catalog.py --check
      - name: Run headless regression tests
        run: python -m unittest discover -s desktop -p "test_*.py" -v
      - name: Test real Tkinter UI under a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python desktop/gui_smoke.py
      - name: Install standalone packager
        run: python -m pip install "pyinstaller>=6.11,<7"
      - name: Build native desktop binary
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SmartChart --add-data "atlas:atlas" desktop/smartchart.py
      - name: Upload install-free desktop executable
        uses: actions/upload-artifact@v4
        with:
          name: SmartChart-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
