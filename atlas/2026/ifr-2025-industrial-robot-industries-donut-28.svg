<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="770" viewBox="0 0 1480 770" role="img" aria-labelledby="t d"><title id="t">Industrial robot installations by customer industry, 2025</title><desc id="d">Verified donut chart of 603307 installed industrial robots worldwide in 2025: 142235 in electrical electronics, 138429 in automotive, 108571 in metal machinery, and 214072 in all remaining industries. Data from IFR World Robotics 2026 executive summary published September 24 2026.</desc><rect width="1480" height="770" fill="#F7FAF8"/><text x="54" y="61" font-size="32" fill="#143B40" text-anchor="start" font-weight="700" font-family="Arial,Helvetica,sans-serif">ELECTRONICS OVERTAKES AUTO FOR INDUSTRIAL ROBOTS</text><text x="56" y="96" font-size="19" fill="#566F6A" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">2025 global installations by customer industry  ·  IFR World Robotics 2026</text><line x1="55" y1="120" x2="1415" y2="120" stroke="#D1DFD9" stroke-width="2"/><path d="M 460.00 145.00 A 245 245 0 0 1 704.02 368.11 L 583.50 378.92 A 124 124 0 0 0 460.00 266.00 Z" fill="#188E9E" stroke="#F7FAF8" stroke-width="5"><title>Electrical and electronics: 142,235 installations (23.58%)</title></path><path d="M 704.02 368.11 A 245 245 0 0 1 513.13 629.17 L 486.89 511.05 A 124 124 0 0 0 583.50 378.92 Z" fill="#DB8853" stroke="#F7FAF8" stroke-width="5"><title>Automotive: 138,429 installations (22.95%)</title></path><path d="M 513.13 629.17 A 245 245 0 0 1 266.25 539.96 L 361.94 465.90 A 124 124 0 0 0 486.89 511.05 Z" fill="#706DB1" stroke="#F7FAF8" stroke-width="5"><title>Metal and machinery: 108,571 installations (18.00%)</title></path><path d="M 266.25 539.96 A 245 245 0 0 1 460.00 145.00 L 460.00 266.00 A 124 124 0 0 0 361.94 465.90 Z" fill="#8798A0" stroke="#F7FAF8" stroke-width="5"><title>All other industries: 214,072 installations (35.48%)</title></path><circle cx="460" cy="390" r="117" fill="#FFFFFF"/><text x="460" y="360" font-size="40" fill="#153E42" text-anchor="middle" font-weight="700" font-family="Arial,Helvetica,sans-serif">603,307</text><text x="460" y="397" font-size="17" fill="#52716B" text-anchor="middle" font-weight="600" font-family="Arial,Helvetica,sans-serif">new industrial robots</text><text x="460" y="425" font-size="15" fill="#55736D" text-anchor="middle" font-weight="normal" font-family="Arial,Helvetica,sans-serif">installed during 2025</text><text x="840" y="186" font-size="18" fill="#204A46" text-anchor="start" font-weight="700" font-family="Arial,Helvetica,sans-serif">SECTOR</text><text x="1418" y="186" font-size="18" fill="#204A46" text-anchor="end" font-weight="700" font-family="Arial,Helvetica,sans-serif">SHARE</text><rect x="840" y="215" width="23" height="23" rx="4" fill="#188E9E"/><text x="879" y="233" font-size="22" fill="#204944" text-anchor="start" font-weight="700" font-family="Arial,Helvetica,sans-serif">Electrical and electronics</text><text x="1418" y="233" font-size="23" fill="#183E42" text-anchor="end" font-weight="700" font-family="Arial,Helvetica,sans-serif">23.58%</text><text x="880" y="264" font-size="17" fill="#5C746F" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">142,235 installations</text><rect x="840" y="317" width="23" height="23" rx="4" fill="#DB8853"/><text x="879" y="335" font-size="22" fill="#204944" text-anchor="start" font-weight="700" font-family="Arial,Helvetica,sans-serif">Automotive</text><text x="1418" y="335" font-size="23" fill="#183E42" text-anchor="end" font-weight="700" font-family="Arial,Helvetica,sans-serif">22.95%</text><text x="880" y="366" font-size="17" fill="#5C746F" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">138,429 installations</text><rect x="840" y="419" width="23" height="23" rx="4" fill="#706DB1"/><text x="879" y="437" font-size="22" fill="#204944" text-anchor="start" font-weight="700" font-family="Arial,Helvetica,sans-serif">Metal and machinery</text><text x="1418" y="437" font-size="23" fill="#183E42" text-anchor="end" font-weight="700" font-family="Arial,Helvetica,sans-serif">18.00%</text><text x="880" y="468" font-size="17" fill="#5C746F" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">108,571 installations</text><rect x="840" y="521" width="23" height="23" rx="4" fill="#8798A0"/><text x="879" y="539" font-size="22" fill="#204944" text-anchor="start" font-weight="700" font-family="Arial,Helvetica,sans-serif">All other industries</text><text x="1418" y="539" font-size="23" fill="#183E42" text-anchor="end" font-weight="700" font-family="Arial,Helvetica,sans-serif">35.48%</text><text x="880" y="570" font-size="17" fill="#5C746F" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">214,072 installations</text><text x="880" y="595" font-size="14" fill="#5D6D69" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Calculated remainder, not a separately reported line</text><line x1="58" y1="664" x2="1422" y2="664" stroke="#D1DFD9" stroke-width="2"/><text x="57" y="697" font-size="15" fill="#526862" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Source: IFR World Robotics 2026, Executive Summary, pp. 16–17. Released Sept. 24, 2026.</text><text x="57" y="723" font-size="14" fill="#526862" text-anchor="start" font-weight="normal" font-family="Arial,Helvetica,sans-serif">Method: Four mutually exclusive categories; residual = 603,307 − 142,235 − 138,429 − 108,571 = 214,072.</text><rect x="1241" y="712" width="187" height="26" fill="#050806"/><text x="1249" y="731" font-size="14" fill="#39FF14" text-anchor="start" font-weight="700" font-family="Arial,Helvetica,sans-serif">BitcoinVersus.tech</text></svg>