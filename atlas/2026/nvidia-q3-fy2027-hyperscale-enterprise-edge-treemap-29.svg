<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 840" width="1580" height="840" role="img" aria-labelledby="title desc"><title id="title">Where NVIDIA's $115.844 billion Q3 FY2027 revenue came from</title><desc id="desc">Revenue treemap from NVIDIA's official November 17, 2026 market-platform revenue table. The Data Center parent totals $107.610 billion, divided into Hyperscale $60.136 billion and AI Clouds, Industrial, and Enterprise $47.474 billion. Edge Computing totals $8.234 billion outside Data Center. All three leaves sum to $115.844 billion.</desc><rect width="100%" height="100%" fill="#f7faf9"/><text x="58.0" y="61" font-size="31" fill="#173C43" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">NVIDIA'S $115.8B QUARTER | WHERE THE REVENUE LANDED</text><text x="60.0" y="102" font-size="18" fill="#55736C" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Q3 fiscal 2027 · Quarter ended Oct. 25, 2026 · Revenue in U.S. dollars</text><line x1="58" y1="128" x2="1510" y2="128" stroke="#D8E1DC" stroke-width="2"/><text x="60.0" y="185" font-size="19" fill="#235C59" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">DATA CENTER PARENT · $107.610B · 92.89%</text><text x="1044.4" y="185" font-size="18" fill="#A77234" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">EDGE</text><rect x="60" y="219" width="545.0675045751183" height="476" fill="#174F60" stroke="#f7faf9" stroke-width="4" rx="6"/><rect x="605.0675045751183" y="219" width="430.3002313456027" height="476" fill="#298F89" stroke="#f7faf9" stroke-width="4" rx="6"/><rect x="1035.3677359207209" y="219" width="74.63226407927903" height="476" fill="#D8A467" stroke="#f7faf9" stroke-width="4" rx="6"/><rect x="60" y="219" width="975.367735920721" height="476" fill="none" stroke="#173D41" stroke-width="2" rx="6"/><text x="90.0" y="286" font-size="22" fill="#D7F7EE" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">HYPERSCALE</text><text x="90.0" y="366" font-size="46" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">$60.136B</text><text x="90.0" y="406" font-size="18" fill="#D0E8E6" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">51.91% of NVIDIA revenue</text><text x="629.1" y="287" font-size="20" fill="#F4FFFE" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">AI CLOUDS, INDUSTRIAL</text><text x="629.1" y="315" font-size="20" fill="#F4FFFE" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">&amp; ENTERPRISE</text><text x="629.1" y="383" font-size="40" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">$47.474B</text><text x="629.1" y="417" font-size="17" fill="#DCF2E8" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">40.98% of NVIDIA revenue</text><g transform="translate(1072.68 457.00) rotate(-90)"><text x="0.0" y="0" font-size="21" fill="#2F3C40" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="middle">EDGE  $8.234B</text></g><line x1="1146" y1="219" x2="1146" y2="695" stroke="#C5D9D0" stroke-width="1"/><text x="1210.0" y="235" font-size="18" fill="#2B524B" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">AUDITED REVENUE SHARE</text><rect x="1210" y="266" width="17" height="17" rx="3" fill="#174F60"/><text x="1237.0" y="285" font-size="16" fill="#3C6059" font-family="Arial,Helvetica,sans-serif" font-weight="600" text-anchor="start">Hyperscale</text><text x="1238.0" y="339" font-size="17" fill="#143C3A" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">$60.136B · 51.91%</text><rect x="1210" y="369" width="17" height="17" rx="3" fill="#298F89"/><text x="1237.0" y="388" font-size="16" fill="#3C6059" font-family="Arial,Helvetica,sans-serif" font-weight="600" text-anchor="start">AI Clouds / Industrial</text><text x="1237.0" y="409" font-size="16" fill="#3C6059" font-family="Arial,Helvetica,sans-serif" font-weight="600" text-anchor="start">/ Enterprise</text><text x="1238.0" y="456" font-size="17" fill="#143C3A" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">$47.474B · 40.98%</text><rect x="1210" y="486" width="17" height="17" rx="3" fill="#D8A467"/><text x="1237.0" y="505" font-size="16" fill="#3C6059" font-family="Arial,Helvetica,sans-serif" font-weight="600" text-anchor="start">Edge Computing</text><text x="1238.0" y="559" font-size="17" fill="#143C3A" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">$8.234B · 7.11%</text><text x="1210.0" y="640" font-size="18" fill="#153E41" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">Total = $115.844B</text><text x="1210.0" y="670" font-size="14" fill="#567069" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">No double-counted platforms</text><line x1="58" y1="735" x2="1510" y2="735" stroke="#D8E1DC" stroke-width="2"/><text x="58.0" y="770" font-size="16" fill="#405E5A" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Source: NVIDIA Revenue by Market Platform, fiscal Q3 2027, published Nov. 17, 2026.</text><text x="58.0" y="800" font-size="14" fill="#55706A" font-family="Arial,Helvetica,sans-serif" font-weight="normal" text-anchor="start">Data Center is the parent of Hyperscale and AI Clouds / Industrial / Enterprise; Edge is separate.</text><rect x="1335" y="785" width="178" height="26" fill="#050A08"/><text x="1342.0" y="804" font-size="14" fill="#39FF14" font-family="Arial,Helvetica,sans-serif" font-weight="700" text-anchor="start">BitcoinVersus.tech</text></svg>