ds</text><text x="1308" y="638" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#526a6a" font-weight="400" text-anchor="start">Rejected energy</text><text x="57" y="917" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#426a67" font-weight="700" text-anchor="start">RESIDENTIAL</text><text x="57" y="941" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#526868" font-weight="400" text-anchor="start">7.30 services / 3.93 rejected</text><text x="365" y="917" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#426a67" font-weight="700" text-anchor="start">COMMERCIAL</text><text x="365" y="941" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#526868" font-weight="400" text-anchor="start">6.17 services / 3.32 rejected</text><text x="707" y="917" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#426a67" font-weight="700" text-anchor="start">INDUSTRIAL</text><text x="707" y="941" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#526868" font-weight="400" text-anchor="start">12.93 services / 13.46 rejected</text><text x="1110" y="917" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#426a67" font-weight="700" text-anchor="start">TRANSPORTATION</text><text x="1110" y="941" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#526868" font-weight="400" text-anchor="start">5.94 services / 22.35 rejected</text><path d="M55 981 H1545" stroke="#cfdad7" stroke-width="2"/><text x="55" y="1006" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#4e6767" font-weight="400" text-anchor="start">DATA: LLNL 2024 U.S. Energy Flow Chart (released Sept. 17, 2026), from EIA State Energy Data System.</text><text x="55" y="1030" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#4e6767" font-weight="400" text-anchor="start">Method: Rejected conversion 19.21 + rejected end uses 43.06 = 62.27 quads; services 32.34.</text><text x="55" y="1053" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#4e6767" font-weight="400" text-anchor="start">All values in quads. Intermediate sector inflows are compressed; published numbers may differ by 0.01 after rounding.</text><rect x="1368" y="1036" width="173" height="28" rx="0" fill="#020705"/><text x="1375" y="1055" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#39FF14" font-weight="700" text-anchor="start">BitcoinVersus.tech</text></svg>