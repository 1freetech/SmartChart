<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img" aria-labelledby="title desc"><title id="title">Where America's 2024 energy went, Sankey #32</title><desc id="desc">Lawrence Livermore National Laboratory's official U.S. 2024 energy balance, simplified with exact reported quantities. Total 94.61 quads from source rounding: 19.21 quads rejected in electricity conversion; residential 11.23, commercial 9.49, industrial 26.39, transportation 28.29 quads of end use. End-use sectors ultimately delivered 32.34 quads in services and rejected 43.06, bringing total rejected energy to 62.27 quads.</desc><rect width="100%" height="100%" fill="#f6f9f8"/><text x="55" y="60" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#14383c" font-weight="700" text-anchor="start">AMERICA'S ENERGY RIVER | 2024</text><text x="55" y="98" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#496768" font-weight="400" text-anchor="start">SmartChart #32 · Sankey · 1 quad = 10¹⁵ Btu · Width of each ribbon proportional to energy</text><path d="M55 125 H1545" stroke="#cfdad7" stroke-width="2"/><text x="143" y="170" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#486367" font-weight="700" text-anchor="middle">PRIMARY ENERGY</text><text x="565" y="170" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#486367" font-weight="700" text-anchor="middle">CONVERSION + END USE</text><text x="1282" y="170" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#486367" font-weight="700" text-anchor="middle">ENERGY OUTCOMES</text><path d="M162 254 C364.98 254, 364.98 210, 560 210 L560 329.102 C364.98 329.102, 364.98 373.102, 162 373.102 Z" fill="#969da0" fill-opacity="0.66" stroke="#f6faf9" stroke-opacity=".35" stroke-width=".5"/><path d="M162 373.102 C364.98 373.102, 364.98 347, 560 347 L560 416.626 C364.98 416.626, 364.98 442.72799999999995, 162 442.72799999999995 Z" fill="#7aaf8b" fill-opacity="0.66" str