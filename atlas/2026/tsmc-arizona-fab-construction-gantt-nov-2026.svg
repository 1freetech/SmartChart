<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="840" viewBox="0 0 1550 840" role="img" aria-labelledby="chartTitle chartDesc"><title id="chartTitle">TSMC Arizona Fab-by-Fab schedule, Gantt and milestone chart, as of November 18, 2026</title><desc id="chartDesc">Verified TSMC Arizona milestones include Fab 1 N4 volume production in 2024, Fab 2 building complete in 2025 and tools being installed in 2026 with N3 production targeted third quarter 2027, Fab 3 groundbroken April 2025 and topped out May 2026, early construction for Fab 4 and packaging in 2026, additional fabs announced July 2026, water reclamation plant expected 2028. Unknown completion dates remain unspecified.</desc><rect width="1550" height="840" fill="#f7f9f8"/><text x="55.0" y="55" font-size="30" fill="#0f2927" font-weight="700" font-family="Arial,Helvetica,sans-serif" text-anchor="start">TSMC ARIZONA | FAB-BY-FAB CONSTRUCTION CLOCK</text><text x="56.0" y="87" font-size="19" fill="#4b6460" font-weight="400" font-family="Arial,Helvetica,sans-serif" text-anchor="start">Observed milestones, ongoing work and company targets, not a construction completion forecast</text><text x="55.0" y="125" font-size="15" fill="#45605a" font-weight="700" font-family="Arial,Helvetica,sans-serif" text-anchor="start">PROJECT / ACTIVITY</text><line x1="420" y1="135" x2="420" y2="755" stroke="#dce6e4" stroke-width="1"/><text x="467.0" y="126" font-size="17" fill="#345451" font-weight="700" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">2020</text><line x1="514" y1="135" x2="514" y2="755" stroke="#dce6e4" stroke-width="1"/><text x="561.0" y="126" font-size="17" fill="#345451" font-weight="700" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">2021</text><line x1="608" y1="135" x2="608" y2="755" stroke="#dce6e4" stroke-width="1"/><text x="655.0" y="126" font-size="17" fill="#345451" font-weight="700" font-family="Arial,Helvetica,sans-serif" text-anchor="middle">2022</text><line x1="702" y