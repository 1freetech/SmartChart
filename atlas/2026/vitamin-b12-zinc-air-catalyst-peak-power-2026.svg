<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Vertical bar chart comparing zinc-air cell peak power: 25 milliwatts with nanotubes only and 30 milliwatts with vitamin B12 on nanotubes in same 6 molar KOH lab test."><rect width="1200" height="675" fill="white"/><text x="92" y="80" font-family="Arial,sans-serif" font-weight="bold" font-size="32" fill="#14253e">Vitamin B12 improves zinc-air peak power in the lab</text><text x="92" y="119" font-family="Arial,sans-serif" font-size="20" fill="#4b596a">Measured output from two comparable small experimental cells (mW)</text><g font-family="Arial,sans-serif" fill="#44546a" font-size="18"><path d="M140 500H1080" stroke="#d9e0e8" stroke-width="1"/><text x="125" y="506" text-anchor="end">0</text><path d="M140 450H1080" stroke="#d9e0e8" stroke-width="1"/><text x="125" y="456" text-anchor="end">5</text><path d="M140 400H1080" stroke="#d9e0e8" stroke-width="1"/><text x="125" y="406" text-anchor="end">10</text><path d="M140 350H1080" stroke="#d9e0e8" stroke-width="1"/><text x="125" y="356" text-anchor="end">15</text><path d="M140 300H1080" stroke="#d9e0e8" stroke-width="1"/><text x="125" y="306" text-anchor="end">20</text><path d="M140 250H1080" stroke="#d9e0e8" stroke-width="1"/><text x="125" y="256" text-anchor="end">25</text><path d="M140 200H1080" stroke="#d9e0e8" stroke-width="1"/><text x="125" y="206" text-anchor="end">30</text><path d="M140 150H1080" stroke="#d9e0e8" stroke-width="1"/><text x="125" y="156" text-anchor="end">35</text></g><rect x="306" y="250" width="210" height="250" fill="#5a8bcc"/><rect x="704" y="200" width="210" height="300" fill="#d07840"/><text x="411" y="234" fill="#14253e" font-weight="bold" font-family="Arial,sans-serif" text-anchor="middle" font-size="28">25 mW</text><text x="809" y="184" fill="#14253e" font-weight="bold" font-family="Arial,sans-serif" text-anchor="middle" font-size="28">30 mW</text><path d="M140 500H1080" stroke="#182d4d" stroke-width="2"/><g font-family="Arial,sans-serif" fill="#283b54" font-size="20"><text x="411" y="538" text-anchor="middle">Nanotubes only</text><text x="809" y="538" text-anchor="middle">Vitamin B12 + nanotubes</text></g><text x="90" y="599" font-family="Arial,sans-serif" font-size="17" fill="#47596f">Liquid-electrolyte zinc-air cells, 6 M KOH, 1.1 cm² active electrode area. Zero baseline.</text><text x="90" y="631" font-family="Arial,sans-serif" font-size="17" fill="#47596f">Source: García-Caballero et al., Journal of Materials Chemistry A (2026), Fig. 5A, DOI:10.1039/D6TA02773C.</text><text x="90" y="655" font-family="Arial,sans-serif" font-size="16" fill="#47596f">Laboratory peak power, not capacity, commercial performance, or longevity.</text></svg>
