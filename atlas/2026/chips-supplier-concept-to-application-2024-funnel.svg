<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc"><title id="title">U.S. CHIPS supplier concept-to-application funnel, 2024</title><desc id="desc">In the 2024 federal CHIPS semiconductor materials and manufacturing equipment program, 165 concept plans were submitted, 53 applicants were invited to file full applications, and 50 full applications were received. This is historical 2024 application data, not the count of the funding opportunity reopened in 2026.</desc><rect width="100%" height="100%" fill="#f7faf9"/><text x="64" y="63" font-family="Arial,Helvetica,sans-serif" font-size="37" fill="#173c43" font-weight="700" text-anchor="start">THE CHIP SUPPLIER APPLICATION FUNNEL</text><text x="66" y="101" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#617675" font-weight="400" text-anchor="start">CHIPS materials and manufacturing equipment funding · 2024 application cohort</text><path d="M64 131 H1376" stroke="#d3e3de" stroke-width="2"/><text x="65" y="168" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#617675" font-weight="700" text-anchor="start">STAGE</text><text x="1375" y="168" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#617675" font-weight="700" text-anchor="end">SHARE OF ORIGINAL 165</text><path d="M 192 220 L 1218 220 Q 1230 220 1230 232 L 1230 334 Q 1230 346 1218 346 L 192 346 Q 180 346 180 334 L 180 232 Q 180 220 192 220 Z" fill="#1f4c61"/><text x="705" y="276" font-family="Arial,Helvetica,sans-serif" font-size="48" fill="#fff" font-weight="700" text-anchor="middle">165</text><text x="705" y="308" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">Plans</text><text x="65" y="268" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1d4344" font-weight="700" text-anchor="start">Concept plans received</text><text x="65" y="295" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#506b69" font-weight="400" text-anchor="start">Original submission cohort</text><text x="1375" y="271" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#1d4344" font-weight="700" text-anchor="end">100.0%</text><path d="M 705 353 v 55 M 697 398 l 8 8 8 -8" fill="none" stroke="#a1c2b9" stroke-width="3"/><path d="M 548.3636363636364 422 L 861.6363636363636 422 Q 873.6363636363636 422 873.6363636363636 434 L 873.6363636363636 536 Q 873.6363636363636 548 861.6363636363636 548 L 548.3636363636364 548 Q 536.3636363636364 548 536.3636363636364 536 L 536.3636363636364 434 Q 536.3636363636364 422 548.3636363636364 422 Z" fill="#178287"/><text x="705" y="478" font-family="Arial,Helvetica,sans-serif" font-size="48" fill="#fff" font-weight="700" text-anchor="middle">53</text><text x="705" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">Invitations</text><text x="65" y="470" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1d4344" font-weight="700" text-anchor="start">Invited to complete a full application</text><text x="65" y="497" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#506b69" font-weight="400" text-anchor="start">32.1% of concept plans</text><text x="1375" y="473" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#1d4344" font-weight="700" text-anchor="end">32.1%</text><path d="M 705 555 v 55 M 697 600 l 8 8 8 -8" fill="none" stroke="#a1c2b9" stroke-width="3"/><path d="M 557.9090909090909 625 L 852.0909090909091 625 Q 864.0909090909091 625 864.0909090909091 637 L 864.0909090909091 739 Q 864.0909090909091 751 852.0909090909091 751 L 557.9090909090909 751 Q 545.9090909090909 751 545.9090909090909 739 L 545.9090909090909 637 Q 545.9090909090909 625 557.9090909090909 625 Z" fill="#44ac94"/><text x="705" y="681" font-family="Arial,Helvetica,sans-serif" font-size="48" fill="#fff" font-weight="700" text-anchor="middle">50</text><text x="705" y="713" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#fff" font-weight="600" text-anchor="middle">Applications</text><text x="65" y="673" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1d4344" font-weight="700" text-anchor="start">Full applications received</text><text x="65" y="700" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#506b69" font-weight="400" text-anchor="start">94.3% of invitees</text><text x="1375" y="676" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#1d4344" font-weight="700" text-anchor="end">30.3%</text><path d="M64 793 H1376" stroke="#d3e3de" stroke-width="2"/><text x="64" y="820" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#526965" font-weight="400" text-anchor="start">SOURCE: U.S. Department of Commerce OIG, 2025 status report (Figure 5), using July 1, 2024 application counts.</text><text x="64" y="845" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#526965" font-weight="400" text-anchor="start">2026 update: the reopened materials/equipment funding notice now accepts concept plans through October 29, 2027 (NIST).</text><rect x="1228" y="826" width="147" height="22" rx="1" fill="#020903"/><text x="1236" y="842" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#39FF14" font-weight="700" text-anchor="start">BitcoinVersus.tech</text></svg>